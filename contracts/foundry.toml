[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
test = "test"
script = "script"
fs_permissions = [{ access = "read", path = "./" }, { access = "read", path = "../circuits/" }, { access = "write", path = "./" }]

